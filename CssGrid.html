<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-item1 {
            grid-area: header;
        }
        .grid-item2 {
            grid-area: menu;
        }
        .grid-item3 {
            grid-area: main;
        }
        .grid-item4 {
            grid-area: footer;
        }
        .grid-container {
            display: grid;
            grid-template-columns:auto auto auto auto auto;
            grid-template-areas:
                "header header header header header"
                "menu main main main main"
                " menu footer footer footer footer";  
                background-color: mediumseagreen;
                padding: 10px;
        }
        .grid-container div {
            background-color: rgb(216, 57, 84);
            text-align: center;
            padding: 20px;
            border: 3px solid rgba(135, 213, 99, 0.8);
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item1">header</div>
        <div class="grid-item2">menu</div>
        <div class="grid-item3">main</div>
        <div class="grid-item4">footer</div>
    </div>
</body>
</html>
