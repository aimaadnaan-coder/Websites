<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #myElement {
            border: 1px solid #ccc;
            width: 100px;
            height: 100px;
        }
    </style>
    <meta charset="utf-8">
</head>
<body>
    <h2> Change Font Color Of HTML Element in JavaScript</h2>
    <div id="myElement">hello World!</,</div>
    <br>
       <button type="button"
       onclick="changestyle()">clickMe</button>
         <script>
            function changestyle() {
                var element =document.getElementById("myElement");
                element.style.color = "red";
            }
         </script>
</body>
</html>
